name: API - Tests & Coverage (Jest)

on:
  push:
    paths:
      - "api/**"
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    name: API tests (Jest + coverage)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests (Jest Coverage Report)
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
        
          working-directory: ./api
          test-script: npm test
