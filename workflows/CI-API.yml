name: CI - API

on:
  push:
    paths:
      - "api/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "api/**"

jobs:
  test:
    name: Jest + Coverage
    runs-on: ubuntu-latest

    # Nodig zodat de coverage action comments/checks kan plaatsen
    permissions:
      contents: read
      pull-requests: write
      checks: write

    # Default working dir voor alle `run:` stappen
    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Deze actie runt jest met coverage en faalt automatisch als coverageThreshold niet gehaald wordt
      - name: Run Tests (Jest coverage report)
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: ./api
          test-script: npm test